sentence=Enables reading and writing to "permanent" storage over a reserved region of this chip's RRAM.
paragraph=Standard Arduino EEPROM.read()/write()/update()/get()/put() surface. Writes persist immediately (this chip's RRAM is directly byte-writable, unlike NOR flash) -- commit() is kept only for source compatibility with ESP8266/ESP32-style sketches and is a real no-op here.
